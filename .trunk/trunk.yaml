---
# Trunk.io configuration (schema 0.1).
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: f39f279b12a9f572e8af98d23d153524239928dc  # v1.10.2

lint:
  enabled:
    - clippy
    # Pin plugin-managed tools so `trunk tools install --ci` never resolves
    # an unspecified version as the invalid SYSTEM sentinel.
    - eslint@8.10.0
    - golangci-lint@1.64.8
    - mypy@1.20.2
    - ruff@0.14.3
    - rustfmt
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1
  ignore:
    - linters: [ALL]
      paths:
        - .git/
        - "*.lock"

---
# Trunk Code Quality configuration.
# See the Trunk CLI configuration documentation for details.
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      # Keep the plugin catalog immutable and aligned with the pinned tool
      # versions below. The prior tag-based source left installs resolving
      # the environment sentinel `SYSTEM` as a tool version.
      ref: f39f279b12a9f572e8af98d23d153524239928dc  # v1.10.2

# Keep the complete repository lint surface enabled. Trunk supplies the
# pinned commands and their default file/config detection for these tools.
lint:
  ignore:
    - linters: [rustfmt]
      # The root Cargo workspace is edition 2021; cargo fmt is its
      # authoritative formatter. Trunk's iac stdin formatter uses edition 2024.
      paths:
        - crates/pheno-config/src/lib.rs
  enabled:
    - actionlint@1.7.8
    - black@25.9.0
    - clippy
    - eslint@8.10.0
    - golangci-lint@1.64.8
    - mypy@1.20.2
    - prettier@3.6.2
    - ruff@0.14.3
    - rustfmt
    - shellcheck@0.11.0
    - taplo@0.10.0
    - yamllint@1.37.1
  definitions:
    - name: rustfmt
      files: [rust]
      commands:
        - name: format
          run: rustfmt --edition 2024
          output: rewrite
          success_codes: [0]
          stdin: true
          formatter: true

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  disabled:
    - trunk-upgrade-available


# Trunk Code Quality configuration.
# See https://docs.trunk.io/code-quality/overview/cli/getting-started/configuration
version: 0.1

cli:
  version: 1.22.2

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
      uri: https://github.com/trunk-io/plugins

# Keep the complete repository lint surface enabled. Trunk supplies the
# pinned commands and their default file/config detection for these tools.
lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
  definitions:
    - name: rustfmt
      files: [rust]
      commands:
        - name: format
          run: rustfmt --edition 2024
          output: rewrite
          success_codes: [0]
          stdin: true
          formatter: true

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  disabled:
    - trunk-upgrade-available

# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - name: Trunk Check
        uses: trunk-io/trunk-action@274409d390f23841b19a1b84b55339196b56453d # v1.0.5
      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        uses: trunk-io/trunk-action@274409d390f23841b19a1b84b55339196b56453d # v1.0.5
        with:
          trunk-args: --upgrade

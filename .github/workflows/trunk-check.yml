# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
      - name: Trunk Check
        uses: trunk-io/trunk-action@22e948f7bb9f870bc6c42625585f1ef27e9c5afc # v1.0.4
        with:
          cache: false
      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        uses: trunk-io/trunk-action@22e948f7bb9f870bc6c42625585f1ef27e9c5afc # v1.0.4
        with:
          cache: false
          trunk-args: --upgrade

name: Docs & Workflow Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vale:
    name: Vale (markdown prose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a
        with:
          files: '["."]'
          filter_mode: nofilter
          fail_on_error: false
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    name: actionlint (GitHub Actions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install actionlint
        run: |
          set -euo pipefail
          # Pin the analyzer and retry transient release/CDN failures.  The
          # previous unpinned one-shot download made this required gate fail
          # before linting when GitHub returned a transient 5xx/429.
          for attempt in 1 2 3; do
            if bash <(curl --fail --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
              https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
              1.7.12; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "actionlint download failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          test -x "$PWD/actionlint" || test -x "$PWD/actionlint.exe"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color
